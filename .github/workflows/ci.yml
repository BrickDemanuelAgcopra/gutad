name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: gutad, POSTGRES_PASSWORD: gutad, POSTGRES_DB: gutad }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gutad" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://gutad:gutad@localhost:5432/gutad
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-ci-secret-ci-secret-1234
      ADMIN_PASSWORD: admin12345
      ALLOW_BILLING_TIME_TRAVEL: "true"  # smoke test jumps ahead to a renewal; never set in production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npm run typecheck -w apps/api && npm run typecheck -w apps/web && npm run typecheck -w apps/mobile
      - run: npm run build -w apps/api
      - run: cd apps/api && node dist/db/migrate.js && node dist/db/seed.js
      - run: cd apps/api && (node dist/main.js & sleep 8) && cd ../.. && node scripts/smoke.mjs
      - run: NEXT_PUBLIC_API_URL=http://localhost:4000 npm run build -w apps/web
  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t gutad/api:ci .
      - run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://api.gutad.io -t gutad/web:ci .
