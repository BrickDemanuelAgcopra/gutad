# Local development stack: `docker compose up`. API on :4000, web on :3000.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gutad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gutad}
      POSTGRES_DB: ${POSTGRES_DB:-gutad}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gutad}"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gutad}:${POSTGRES_PASSWORD:-gutad}@postgres:5432/${POSTGRES_DB:-gutad}
      REDIS_URL: redis://redis:6379
      PUBLIC_WEB_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:4000
      RUN_SEED: "true"
      PORT: 4000
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gutad}:${POSTGRES_PASSWORD:-gutad}@postgres:5432/${POSTGRES_DB:-gutad}
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: "false"
    depends_on: { api: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { NEXT_PUBLIC_API_URL: http://localhost:4000, PUBLIC_WEB_URL: http://localhost:3000 } }
    environment: { INTERNAL_API_URL: http://api:4000 }
    ports: ["3000:3000"]
    depends_on: { api: { condition: service_healthy } }
volumes:
  pgdata: {}
  redisdata: {}
