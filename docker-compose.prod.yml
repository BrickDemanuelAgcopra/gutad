# Production stack for a single VPS: Caddy terminates TLS for gutad.io + api.gutad.io.
# Usage: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"], interval: 10s, timeout: 5s, retries: 20 }
    command: ["postgres", "-c", "max_connections=120", "-c", "shared_buffers=256MB", "-c", "log_min_duration_statement=500"]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: ["redisdata:/data"]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: gutad/api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_SEED: ${RUN_SEED:-true}
      SEED_DEMO: ${SEED_DEMO:-true}
      PORT: 4000
      PG_POOL_MAX: 20
    expose: ["4000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }
  worker:
    image: gutad/api:latest
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment: { RUN_MIGRATIONS: "false" }
    healthcheck: { disable: true }   # image HEALTHCHECK probes :4000, which only the api serves
    depends_on: { api: { condition: service_healthy } }
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { NEXT_PUBLIC_API_URL: "${PUBLIC_API_URL}", PUBLIC_WEB_URL: "${PUBLIC_WEB_URL}" } }
    image: gutad/web:latest
    restart: unless-stopped
    environment: { INTERNAL_API_URL: http://api:4000, NEXT_PUBLIC_API_URL: "${PUBLIC_API_URL}", PUBLIC_WEB_URL: "${PUBLIC_WEB_URL}" }
    expose: ["3000"]
    depends_on: { api: { condition: service_healthy } }
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { DOMAIN: "${DOMAIN}", API_DOMAIN: "${API_DOMAIN}", ACME_EMAIL: "${ACME_EMAIL}" }
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [web, api]
  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes: ["./deploy/backup.sh:/backup.sh:ro", "./deploy/backups:/backups"]
    depends_on: { postgres: { condition: service_healthy } }
volumes:
  pgdata: {}
  redisdata: {}
  caddy_data: {}
  caddy_config: {}
